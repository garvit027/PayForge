name: payforge

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payforge
      POSTGRES_PASSWORD: payforge
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payforge"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./infra/keycloak/payforge-realm.json:/opt/keycloak/data/import/payforge-realm.json:ro

  account-service:
    build:
      context: .
      args:
        MODULE: account-service
    environment: &service-env
      DB_HOST: postgres
      DB_USER: payforge
      DB_PASSWORD: payforge
      KAFKA_BOOTSTRAP: kafka:9092
      REDIS_HOST: redis
      JWT_ISSUER: http://localhost:8180/realms/payforge
      JWT_JWK_SET_URI: http://keycloak:8080/realms/payforge/protocol/openid-connect/certs
      INTERNAL_TOKEN: local-dev-internal-token
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_started

  ledger-service:
    build:
      context: .
      args:
        MODULE: ledger-service
    environment:
      <<: *service-env
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_started

  transfer-service:
    build:
      context: .
      args:
        MODULE: transfer-service
    environment:
      <<: *service-env
      ACCOUNT_URL: http://account-service:8081
      LEDGER_URL: http://ledger-service:8082
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      account-service:
        condition: service_started
      ledger-service:
        condition: service_started

  gateway:
    build:
      context: .
      args:
        MODULE: gateway
    environment:
      REDIS_HOST: redis
      ACCOUNT_URL: http://account-service:8081
      LEDGER_URL: http://ledger-service:8082
      TRANSFER_URL: http://transfer-service:8083
      JWT_ISSUER: http://localhost:8180/realms/payforge
      JWT_JWK_SET_URI: http://keycloak:8080/realms/payforge/protocol/openid-connect/certs
      UI_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.54.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

volumes:
  postgres-data:
