server:
  port: 8080

spring:
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: ${UI_ORIGIN:http://localhost:3000}
            allowed-methods: "*"
            allowed-headers: "*"
            exposed-headers: "X-Correlation-Id"
            allow-credentials: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
      routes:
        - id: account-service
          uri: ${ACCOUNT_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/customers/**,/api/v1/accounts/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1

        - id: transfer-service
          uri: ${TRANSFER_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/transfers/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1

        - id: notifications-service
          uri: ${NOTIFICATIONS_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1

        - id: ledger-service
          uri: ${LEDGER_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/ledger/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1

payforge:
  security:
    issuer: ${JWT_ISSUER:http://localhost:8180/realms/payforge}
    jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8180/realms/payforge/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,gateway
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    org.springframework.cloud.gateway: INFO
