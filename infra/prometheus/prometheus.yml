global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway:8080"]

  - job_name: account-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["account-service:8081"]

  - job_name: ledger-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["ledger-service:8082"]

  - job_name: transfer-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["transfer-service:8083"]

  - job_name: notifications-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notifications-service:8084"]
