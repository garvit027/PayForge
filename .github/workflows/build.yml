name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

  images:
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      matrix:
        module: [gateway, account-service, ledger-service, transfer-service]
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no push)
        run: |
          docker build --build-arg MODULE=${{ matrix.module }} -t payforge/${{ matrix.module }}:${{ github.sha }} .
